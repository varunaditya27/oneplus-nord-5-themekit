name: Android / pre-alpha verification
on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Inspect hosted Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Install Android 36 compile platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Attach unsigned debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
