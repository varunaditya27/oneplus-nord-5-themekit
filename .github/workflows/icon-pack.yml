name: Iconography / quality and export

on:
  push:
    branches: [main]
    paths:
      - "iconography/catalog.json"
      - "iconography/build.mjs"
      - "iconography/qa.py"
      - ".github/workflows/icon-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical icon exports
        run: |
          node iconography/build.mjs
          node iconography/check.mjs
          node --check web/icons/gallery.js

      - name: Install raster review tools
        run: python -m pip install "CairoSVG>=2.7,<3.0" "Pillow>=11,<13"

      - name: Render optical QA and contact sheets
        run: python iconography/qa.py

      - name: Package full editable SVG set
        run: |
          mkdir -p dist/iconography
          zip -q -r dist/iconography/ATELIER-Iconography-001.zip \
            iconography/catalog.json \
            iconography/svg \
            iconography/preview \
            docs/ICON_SYSTEM.md \
            docs/ICON_AUDIT.md

      - uses: actions/upload-artifact@v4
        with:
          name: ATELIER-Iconography-001
          path: dist/iconography/ATELIER-Iconography-001.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ATELIER-Optical-Review-001
          path: dist/iconography/previews
          retention-days: 30
