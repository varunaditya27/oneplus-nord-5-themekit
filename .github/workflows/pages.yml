name: Publish ATELIER visual study

# Manual releases remain available; automatic publish runs on web changes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "iconography/catalog.json"
      - "iconography/build.mjs"
      - "motion/**"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate web study
        run: |
          set -euo pipefail
          test -s web/index.html
          node --check web/app.js
          node --check web/motion/studio.js
          node web/test-smoke.mjs
          node --check web/icons/gallery.js
          node iconography/build.mjs
          node iconography/check.mjs
          echo "ATELIER's site, font assets, and complete icon library passed validation."

      - name: Embed brand art and social preview
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "CairoSVG>=2.7,<3.0"
          mkdir -p web/brand
          cp assets/brand/*.svg web/brand/
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url="assets/brand/social-card.svg",
                           write_to="web/brand/social-card.png",
                           output_width=1200,output_height=630)
          assert Path("web/brand/favicon.svg").stat().st_size > 100
          assert Path("web/brand/social-card.png").stat().st_size > 100
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify repository Pages configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [[ "$status" == "404" ]]; then
            echo "::error title=GitHub Pages is not initialized::Open https://github.com/$GITHUB_REPOSITORY/settings/pages and select Build and deployment > Source > GitHub Actions. Then re-run this workflow."
            {
              echo "### One-time Pages setup required"
              echo ""
              echo "The static site passed its checks, but this repository does not yet have a Pages site."
              echo "As repository owner, open **Settings → Pages → Build and deployment → Source: GitHub Actions**."
              echo ""
              echo "Direct link: https://github.com/$GITHUB_REPOSITORY/settings/pages"
              echo ""
              echo "After saving the setting, re-run **Publish ATELIER visual study**."
              echo 'Do not add enablement: true with the default GITHUB_TOKEN: it cannot initialize Pages.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error title=Pages API request failed::GitHub returned HTTP $status. Check repository Pages permissions and Actions policies."
            cat "$response"
            exit 1
          fi
          build_type="$(jq -r '.build_type // empty' "$response")"
          if [[ -n "$build_type" && "$build_type" != "workflow" ]]; then
            echo "::error title=Wrong Pages publishing source::Pages is set to '$build_type'. Under Settings > Pages select Source: GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages is configured for Actions deployment."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### ATELIER is published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Live site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
