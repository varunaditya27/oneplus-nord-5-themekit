name: Android / emulator smoke and screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-emulator.yml"
      - "scripts/ci/emulator-smoke.sh"
      - "scripts/ci/check_screenshots.py"
      - "app/src/main/java/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/values/**"
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: android-emulator-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Install Android build platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build preview
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install, open and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/ci/emulator-smoke.sh
      - name: Audit screenshots for darkness and page changes
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/ci/check_screenshots.py
      - name: Attach screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-emulator-smoke
          path: dist/emulator
          retention-days: 14
