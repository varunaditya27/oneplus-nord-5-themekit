name: Wallpapers / generate and export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_assets.py"
      - "scripts/requirements.txt"
      - ".github/workflows/wallpapers.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate wallpaper masters
        run: python scripts/generate_assets.py
      - name: Verify dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path("assets/wallpapers")
          for name in ("silkfield-ink.webp", "mineral-black.webp", "absolute-ink.webp"):
              path = base / name
              with Image.open(path) as image:
                  assert image.size == (1080, 2400), (name, image.size)
              print(name, path.stat().st_size, "bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-wallpaper-masters
          path: assets/wallpapers/*.webp
          retention-days: 30
