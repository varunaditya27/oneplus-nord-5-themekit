<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title description">
<title id="title">ATELIER architecture and Android system boundaries</title>
<desc id="description">Input from gestures and the launcher flows into the ATELIER Compose shell, pure command engine and preferences, while the Android operating system retains secure and protected system interfaces.</desc>
